[package]
name = "flexserv-deployer"
version = "1.4.1"
edition = "2024"
autobins = false

[lib]
name = "flexserv_deployer"
path = "src/lib.rs"

[[bin]]
name = "flexserv-deployer-server"
path = "src/main.rs"

[[bin]]
name = "flexserv-deployer"
path = "src/bin/flexserv-deployer.rs"

[dependencies]
actix-web = { version = "4.15.0" }
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "native-tls",
    "blocking",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = { version = "1.0.104" }
base64 = "0.23.1"
hf-hub = { version = "1.0.0" }
env_logger = "0.11.11"
log = "0.4.34"
sha2 = "0.11.0"

tapis-pods = "=0.4.4"
tapis-jobs = "0.4.4"
[dev-dependencies]
actix-rt = "2.15.0"
