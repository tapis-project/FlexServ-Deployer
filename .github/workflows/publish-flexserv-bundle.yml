name: Assemble Tapis FlexServ from Component Releases
on:
  push:
    branches: [feature/1.5.0-alpha]
    tags: ['tapis-flexserv-*']
  workflow_dispatch:
    inputs:
      gateway_tag:
        description: Gateway release tag (empty selects latest on feature/1.5.0)
        type: string
      fcs_tag:
        description: FCS release tag (empty selects latest on feature/new_fcs)
        type: string
      pack_tag:
        description: Pack release tag (empty selects latest on feature/new_fcs)
        type: string
      publish_release:
        default: false
        type: boolean
      tag:
        description: Existing Deployer tag at this commit, required for publication
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check packaging and release fixtures
        run: |
          for file in hpc_archive/app/*.sh hpc_archive/scripts/*.sh hpc_archive/scripts/site/*.sh scripts/update-alpha-channel.sh; do bash -n "$file"; done
          python3 -m unittest discover -s tests/release
      - name: Verify read access to component releases
        env:
          GH_TOKEN: ${{ secrets.FLEXSERV_SOURCE_TOKEN || secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
        run: |
          for repo in tapis-project/FlexServ tapis-project/FlexServ-FCS tapis-project/FlexServ-FCS-Pack; do
            gh api "repos/$repo/releases?per_page=5" --jq '[.[]|{tag:.tag_name,draft,assets:(.assets|length)}]'
            # Optional build metadata helps diagnose a component not yet published.
            gh api "repos/$repo/actions/runs?per_page=5" --jq '[.workflow_runs[]|{id,name,ref:.head_branch,status,conclusion}]' || echo 'Build metadata unavailable; release integrity checks remain mandatory.'
          done
  bundle:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: flexserv-bundle-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate final release tag
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -n "$RELEASE_TAG" || { echo 'Create an existing tag at this Deployer commit before publication.' >&2; exit 1; }
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Release tag does not identify this Deployer commit.' >&2; exit 1; }
      - name: Resolve and download published component assets
        env:
          GH_TOKEN: ${{ secrets.FLEXSERV_SOURCE_TOKEN || secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
          GATEWAY_TAG: ${{ inputs.gateway_tag }}
          FCS_TAG: ${{ inputs.fcs_tag }}
          PACK_TAG: ${{ inputs.pack_tag }}
        run: |
          python3 scripts/download_component_releases.py --gateway-tag "$GATEWAY_TAG" --fcs-tag "$FCS_TAG" --pack-tag "$PACK_TAG" --output downloaded
          python3 scripts/prepare_release_inputs.py --downloads downloaded --output dist
      - name: Validate standalone and merged Packs using the released FCS
        run: |
          chmod u+x dist/binaries/flexserv-capability-server-amd64.bin
          for name in tapis-workflow-pack vllm-pack; do
            mkdir -p "pack-check/$name"
            unzip -q "downloaded/pack/$name.zip" -d "pack-check/$name"
            dist/binaries/flexserv-capability-server-amd64.bin --pack "pack-check/$name" --check-pack --allow-unsigned-demo > "dist/$name-check.json"
          done
          mkdir -p pack-check/merged
          unzip -q dist/flexserv-capability-pack.zip -d pack-check/merged
          dist/binaries/flexserv-capability-server-amd64.bin --pack pack-check/merged --check-pack --allow-unsigned-demo > dist/merged-pack-check.json
          rm -rf pack-check
      - name: Assemble complete Tapis ZIP without compiling components
        run: |
          python3 scripts/assemble_bundle.py --source hpc_archive --binaries dist/binaries --pack dist/flexserv-capability-pack.zip --revisions dist/revisions.json --output dist/Tapis-FlexServ.zip
          unzip -t dist/Tapis-FlexServ.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tapis-FlexServ
          path: |
            dist/Tapis-FlexServ.zip*
            dist/*-check.json
          if-no-files-found: error
      - if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          tag=${RELEASE_TAG:?An existing release tag is required}
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Release tag changed during the build.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > dist/uploaded-releases.json
          existing=$(python3 - <<'PY'
          import json,os,pathlib
          matches=[r for page in json.loads(pathlib.Path('dist/uploaded-releases.json').read_text()) for r in page if r['tag_name']==os.environ['RELEASE_TAG']]
          if len(matches)>1: raise SystemExit('Ambiguous release tag')
          print(matches[0]['id'] if matches else '')
          PY
          )
          # The verified tag already pins the source; do not ask the API to create a ref.
          if [ -z "$existing" ]; then
            gh release create "$tag" dist/Tapis-FlexServ.zip* --verify-tag --draft --prerelease --title "$tag" --generate-notes
          fi
          # Draft releases are not reliably available through the public tag lookup.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > dist/uploaded-releases.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          matches=[r for page in json.loads(pathlib.Path('dist/uploaded-releases.json').read_text()) for r in page if r['tag_name']==os.environ['RELEASE_TAG']]
          if len(matches)!=1: raise SystemExit('Expected one release for the verified tag')
          published=matches[0]
          assets={a['name']:a for a in published['assets']}
          expected=[pathlib.Path('dist/Tapis-FlexServ.zip'),pathlib.Path('dist/Tapis-FlexServ.zip.sha256')]
          if set(assets)!={p.name for p in expected}: raise SystemExit('Incomplete draft release; leaving unpublished')
          for p in expected:
              a=assets[p.name]
              if a['size']!=p.stat().st_size or a.get('digest')!='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest():
                  raise SystemExit('Uploaded asset mismatch; leaving draft unpublished')
          pathlib.Path('dist/release-id.txt').write_text(str(published['id']))
          pathlib.Path('dist/release-state.txt').write_text('draft' if published['draft'] else 'published')
          PY
          release_id=$(cat dist/release-id.txt)
          if [ "$(cat dist/release-state.txt)" = draft ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false > dist/published-release.json
          fi
      - name: Refresh fixed Alpha download channel
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: bash scripts/update-alpha-channel.sh "$RELEASE_TAG" dist
