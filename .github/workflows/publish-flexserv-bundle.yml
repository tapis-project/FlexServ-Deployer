name: Publish Tapis FlexServ Alpha Bundle
on:
  push:
    tags: ['tapis-flexserv-*']
  workflow_dispatch:
    inputs:
      gateway_ref:
        description: Gateway source branch or immutable commit
        default: feature/1.5.0-alpha
        type: string
      fcs_ref:
        description: v0.13 FCS source branch or immutable commit
        default: feature/new_fcs
        type: string
      pack_ref:
        description: Unified Pack branch or immutable commit
        default: flexserv/new_fcs
        type: string
      publish_release:
        default: true
        type: boolean
      tag:
        description: Existing tag at this Deployer commit (required when publishing)
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      gateway: ${{ steps.resolve.outputs.gateway }}
      fcs: ${{ steps.resolve.outputs.fcs }}
      pack: ${{ steps.resolve.outputs.pack }}
    steps:
      - name: Validate existing release tag
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -n "$RELEASE_TAG" || { echo 'Create and push a release tag at this Deployer commit before publishing.' >&2; exit 1; }
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Release tag does not identify this Deployer commit.' >&2; exit 1; }
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.FLEXSERV_SOURCE_TOKEN || secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
          SOURCE_READ_TOKEN: ${{ secrets.FLEXSERV_SOURCE_TOKEN || secrets.FCS_ARTIFACT_READ_TOKEN }}
          GATEWAY_REF: ${{ inputs.gateway_ref || 'feature/1.5.0-alpha' }}
          FCS_REF: ${{ inputs.fcs_ref || 'feature/new_fcs' }}
          PACK_REF: ${{ inputs.pack_ref || 'flexserv/new_fcs' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.parse
          if not os.environ.get('SOURCE_READ_TOKEN'):
              raise SystemExit('Configure FLEXSERV_SOURCE_TOKEN (or existing FCS_ARTIFACT_READ_TOKEN) with read access to all three private source repositories before publishing')
          repos={'gateway':('zhangwei217245/FlexServ','GATEWAY_REF'),'fcs':('tapis-project/FlexServ-FCS','FCS_REF'),'pack':('tapis-project/FlexServ-FCS-Pack','PACK_REF')}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,(repo,var) in repos.items():
                  ref=urllib.parse.quote(os.environ[var],safe='')
                  result=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/commits/{ref}']))
                  sha=result['sha']
                  if len(sha)!=40 or any(c not in '0123456789abcdef' for c in sha): raise SystemExit('Invalid source revision')
                  output.write(f'{key}={sha}\n')
          PY
  gateway:
    needs: resolve
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      repository: zhangwei217245/FlexServ
      component: flexserv-gateway
      source-ref: ${{ needs.resolve.outputs.gateway }}
  fcs:
    needs: resolve
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      repository: tapis-project/FlexServ-FCS
      component: flexserv-capability-server
      source-ref: ${{ needs.resolve.outputs.fcs }}
  bundle:
    needs: [resolve, gateway, fcs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: flexserv-bundle-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: tapis-project/FlexServ-FCS-Pack
          token: ${{ secrets.FLEXSERV_SOURCE_TOKEN || secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
          ref: ${{ needs.resolve.outputs.pack }}
          path: selected-pack
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-linux-*'
          path: dist/binaries
          merge-multiple: true
      - name: Package exact Pack and verify source identity
        env:
          GATEWAY_SHA: ${{ needs.resolve.outputs.gateway }}
          FCS_SHA: ${{ needs.resolve.outputs.fcs }}
          PACK_SHA: ${{ needs.resolve.outputs.pack }}
        run: |
          python3 selected-pack/scripts/package_pack.py selected-pack/pack dist/flexserv-capability-pack.zip
          python3 scripts/record_bundle_sources.py --binaries dist/binaries --output dist/revisions.json
      - name: Test scripts and package complete Tapis ZIP
        run: |
          for file in hpc_archive/app/*.sh hpc_archive/scripts/*.sh hpc_archive/scripts/site/*.sh; do bash -n "$file"; done
          python3 -m unittest discover -s tests/release
          python3 scripts/assemble_bundle.py --source hpc_archive --binaries dist/binaries --pack dist/flexserv-capability-pack.zip --revisions dist/revisions.json --output dist/Tapis-FlexServ.zip
          unzip -t dist/Tapis-FlexServ.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tapis-FlexServ
          path: dist/Tapis-FlexServ.zip*
          if-no-files-found: error
      - if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          tag=${RELEASE_TAG:?An existing release tag is required}
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Release tag changed during the build.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > dist/uploaded-releases.json
          existing=$(python3 - <<'PY'
          import json,os,pathlib
          matches=[r for page in json.loads(pathlib.Path('dist/uploaded-releases.json').read_text()) for r in page if r['tag_name']==os.environ['RELEASE_TAG']]
          if len(matches)>1: raise SystemExit('Ambiguous release tag')
          print(matches[0]['id'] if matches else '')
          PY
          )
          # The verified tag already pins the source; do not ask the API to create a ref.
          if [ -z "$existing" ]; then
            gh release create "$tag" dist/Tapis-FlexServ.zip* --verify-tag --draft --prerelease --title "$tag" --generate-notes
          fi
          # Draft releases are not reliably available through the public tag lookup.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > dist/uploaded-releases.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          matches=[r for page in json.loads(pathlib.Path('dist/uploaded-releases.json').read_text()) for r in page if r['tag_name']==os.environ['RELEASE_TAG']]
          if len(matches)!=1: raise SystemExit('Expected one release for the verified tag')
          published=matches[0]
          assets={a['name']:a for a in published['assets']}
          expected=[pathlib.Path('dist/Tapis-FlexServ.zip'),pathlib.Path('dist/Tapis-FlexServ.zip.sha256')]
          if set(assets)!={p.name for p in expected}: raise SystemExit('Incomplete draft release; leaving unpublished')
          for p in expected:
              a=assets[p.name]
              if a['size']!=p.stat().st_size or a.get('digest')!='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest():
                  raise SystemExit('Uploaded asset mismatch; leaving draft unpublished')
          pathlib.Path('dist/release-id.txt').write_text(str(published['id']))
          pathlib.Path('dist/release-state.txt').write_text('draft' if published['draft'] else 'published')
          PY
          release_id=$(cat dist/release-id.txt)
          if [ "$(cat dist/release-state.txt)" = draft ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false > dist/published-release.json
          fi
      - name: Refresh fixed Alpha download channel
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: bash scripts/update-alpha-channel.sh "$RELEASE_TAG" dist
