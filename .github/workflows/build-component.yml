name: Build pinned native component
on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      source-ref:
        type: string
        required: true
      component:
        type: string
        required: true
    secrets:
      FLEXSERV_SOURCE_TOKEN:
        required: false
      FCS_ARTIFACT_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, platform: linux-x86_64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64}
          - {arch: arm64, platform: linux-aarch64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      RUSTFLAGS: ''
      RUSTC_WRAPPER: ''
      CARGO_BUILD_JOBS: '2'
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      LIBCLANG_PATH: /usr/lib64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.source-ref }}
          token: ${{ secrets.FLEXSERV_SOURCE_TOKEN || secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
      - name: Prepare build-only dependencies
        shell: bash
        run: bash scripts/prepare_ci_linux.sh '${{ matrix.arch }}'
      - name: Test and compile exact source revision
        shell: bash
        run: bash scripts/build_linux_release.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
